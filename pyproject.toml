[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dankware"
version = "4.0.0"
description = "Python package with various features!"
readme = "README.md"
license = "MIT"
authors = [
    {name = "SirDank", email = "SirDankenstein@protonmail.com"}
]
requires-python = ">=3.10"
keywords = [
    "dank",
    "dankware",
    "multithread",
    "gradient",
    "fade",
    "registry key",
    "error traceback",
    "random ip",
    "github scraper",
    "splash screen",
    "windows tools",
    "terminal",
]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Topic :: Software Development",
    "Typing :: Typed",
]
dependencies = [
    "rich>=13.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
extras = ["pillow>=10.0.0"]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[project.urls]
"Homepage" = "https://github.com/SirDank/dankware"
"Bug Tracker" = "https://github.com/SirDank/dankware/issues"
"Documentation" = "https://github.com/SirDank/dankware#readme"

[tool.setuptools.packages.find]
where = ["."]
include = ["dankware*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
dankware = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
